name: Fork-only public quality verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3 ripgrep ffmpeg sqlite3
      - name: Create sanitized public candidate
        run: node scripts/public-export.mjs --output "$RUNNER_TEMP/spaceapp-public-export"
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm ci
      - name: Check architecture and types
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run check
      - name: Run full public suite
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm test
      - name: Build production applications
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run build